<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="CSS/padrao.css">
        <link rel="stylesheet" href="CSS/reset.css">
        <link rel="stylesheet" href="CSS/style.css">
    </head>
    <body>
        <header class="fxw">
            <div class="col-3">
                <img class="col-7 logo" src="imagem/logoLanch-removebg-preview.png">
            </div>
            <div class="col-9 direita">
                <img class="col-2 ml-5" src="imagem/whatssap.png">
                <img class="col-2" src="imagem/pedidos.png">
            </div>
            
        </header>
        <section class="fxw s1">
            <h1 class="centraliza col-12">Nossos Destaques</h1>
                <div class="col-2">
                    <img class="col-8" src="imagem/lanche1.jpg">
                </div>
                <div class="col-2">
                    <img class="col-8" src="imagem/lanche2.png">
                </div>
                <div class="col-2">
                    <img class="col-8" src="imagem/lanche3.jpg">
                </div>
                <div class="col-2">
                    <img class="col-8" src="imagem/lanche4.jpg">
                </div>
                <div class="col-2">
                    <img class="col-8" src="imagem/lanche5.jpg">
                </div>
                <div class="col-2">
                    <img class="col-8" src="imagem/lanche6.jpg">
                </div>
            </section>

            <section class="s2">
                <div class="slider">
                    <div class="slide_principal">
                        <input type="radio" name="bola" id="bola1">
                        <input type="radio" name="bola" id="bola2">
                        <div class="col-12 slidee primeiro">
                            <img class="col-12"  src="imagem/banner1.jpg">
                        </div>
                        <div class="col-12 slidee">
                            <img class="col-12"  src="imagem/banner3.jpg">
                        </div>
                    </div>
                </div>
                <div class="quadradinhos">
                    <label for="bola1"><img src="imagem/slideBotao.png"></label>
                    <label for="bola2"><img src="imagem/slideBotao.png"></label>
                </div>
            </section>

            <section class="s3">
                <h1>Escolha seu sanduiche</h1>
                <select id="lanche">
                    <option value="">Selecione</option>
                    <option value="sanduiche1">Sanduiches</option>
                    <option value="coxinha">Coxinhas</option>
                    <option value="pastel">Pasteis</option>
                    <option value="cigarrete">Cigarretes</option>
                    <option value="cubano">Sanduiche Cubano</option>
                    <option value="pizza">Pizzas</option>
                </select>
                <h1>Escolha seu adicional</h1>
                <select id="adicional">
                    <option value="">Selecione</option>
                    <option value="frango">Frango</option>
                    <option value="ovo">Ovo</option>
                    <option value="bacon">Bacon</option>
                </select>
                <div id="resposta"></div>
            </section>
        
        
    </body>
    
    <script src="script.js"></script>
</html>
